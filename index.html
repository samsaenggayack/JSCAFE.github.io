<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三生佳約 · 안내 페이지</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero" id="hero"></section>

<div class="shell">
  <aside class="card sidebar">
    <h2 class="side-title" id="siteTitle">三生佳約</h2>
    <div class="side-sub" id="siteSubtitle">Information & Archive</div>
    <nav class="nav">
      <button class="active" data-view="home"><span class="symbol">一</span> 전체보기</button>
      <button data-view="faq"><span class="symbol">二</span> 자주 묻는 질문</button>
      <button data-view="members"><span class="symbol">三</span> 협력물</button>
      <button data-view="schedule"><span class="symbol">四</span> 일정</button>
    </nav>
    <div class="side-line"></div>
    <div class="contact-mini"><strong>CONTACT</strong><br><a id="contactEmailLink" href="mailto:2027jscafe@gmail.com">2027jscafe@gmail.com</a></div>
  </aside>

  <main class="card main">
    <div class="topbar">
      <div class="search-wrap"><span>⌕</span><input id="globalSearch" type="search" placeholder="공지, 자주 묻는 질문, 일정, 협력물 검색"></div>
      <button class="mini-btn" id="searchBtn">검색</button>
    </div>

    <div id="loadError" class="load-error" hidden></div>

    <section class="view active" id="view-home">
      <div class="eyebrow" id="mainEyebrow"></div>
      <h1 id="mainTitle"></h1>
      <p class="lead" id="mainDescription"></p>
      <div class="notice"><h3 id="noticeTitle"></h3><p id="noticeText"></p></div>
      <div class="quick-grid">
        <button class="quick" data-go="faq"><div class="icon">❓</div><b id="quickFaqTitle">자주 묻는 질문</b><small id="quickFaqDescription"></small></button>
        <button class="quick" data-go="members"><div class="icon">ꕥ</div><b id="quickMembersTitle">협력물</b><small id="quickMembersDescription"></small></button>
        <button class="quick" data-go="schedule"><div class="icon">◈</div><b id="quickScheduleTitle">일정</b><small id="quickScheduleDescription"></small></button>
      </div>
      <div class="section-title">최근 안내</div>
      <div class="post-list" id="postList"></div>
    </section>

    <section class="view" id="view-faq">
      <div class="eyebrow">질의응답</div>
      <h1>자주 묻는 질문</h1>
      <p class="lead" id="faqPageDescription">답변한 문의 내용 등을 확인할 수 있습니다.</p>
      <div class="filters" id="faqFilters"></div>
      <div class="faq-list" id="faqList"></div>
    </section>

    <section class="view" id="view-members">
      <div class="eyebrow">협력</div><h1>협력물</h1>
      <p class="lead" id="membersPageDescription">협력진과 협력물을 확인할 수 있습니다.</p>
      <div class="members" id="memberList"></div>
    </section>

    <section class="view" id="view-schedule">
      <div class="eyebrow">타임라인</div><h1>일정</h1>
      <p class="lead" id="schedulePageDescription">행사 진행 일정을 확인할 수 있습니다.</p>
      <div class="timeline" id="timeline"></div>
    </section>

    <section class="view" id="view-search">
      <div class="eyebrow">Search Archive</div><h1>Search</h1>
      <p class="lead" id="searchSummary">검색어를 입력해주세요.</p>
      <div class="search-results" id="searchResults"></div>
    </section>
  </main>
</div>

<div class="footer" id="footerText"></div>

<button class="chat-fab" id="chatFab" aria-label="문의 챗봇 열기">❓</button>
<div class="chatbox" id="chatbox">
  <div class="chat-head"><div><b>문의 챗봇</b><small>등록된 Q&A를 기준으로 답변합니다.</small></div><button class="chat-close" id="chatClose">×</button></div>
  <div class="messages" id="messages"></div>
  <form class="chat-input" id="chatForm"><input id="chatInput" autocomplete="off" placeholder="예: 카페는 언제 열리나요?"><button type="submit">➤</button></form>
</div>

<script src="fallback-data.js"></script>
<script src="app.js"></script>
</body>
</html>
